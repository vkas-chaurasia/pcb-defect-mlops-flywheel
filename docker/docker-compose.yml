services:
  # Unified MLflow Instance
  mlflow:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow
    user: "501:20"
    ports:
      - "5555:5000"
    working_dir: /mlflow/data
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - MLFLOW_S3_ENDPOINT_URL=http://rustfs:9000
      - MLFLOW_S3_IGNORE_TLS=true
    volumes:
      - ../mlflow-history:/mlflow/data
    command: mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/data/mlflow.db --default-artifact-root mlflow-artifacts:/ --serve-artifacts

  # Official MLflow for Team
  mlflow-official:
    image: ghcr.io/mlflow/mlflow:v2.11.3
    container_name: mlflow-official
    user: "501:20"
    ports:
      - "5556:5000"
    working_dir: /mlflow/data
    environment:
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - MLFLOW_S3_ENDPOINT_URL=http://rustfs:9000
      - MLFLOW_S3_IGNORE_TLS=true
    volumes:
      - ../mlflow-official-history:/mlflow/data
    command: bash -c "touch /mlflow/data/mlflow.db && chmod 666 /mlflow/data/mlflow.db && mlflow server --host 0.0.0.0 --backend-store-uri sqlite:////mlflow/data/mlflow.db --default-artifact-root mlflow-artifacts:/ --serve-artifacts"

  # Human-in-the-Loop Labeling
  label-studio:
    image: heartexlabs/label-studio:1.11.0
    container_name: label-studio
    ports:
      - "8080:8080"
    volumes:
      - ../label_studio_data:/label-studio/data
      - ../data:/label-studio/data/projects-data
    environment:
      - LABEL_STUDIO_LOCAL_FILES_SERVING_ENABLED=true
      - LABEL_STUDIO_LOCAL_FILES_DOCUMENT_ROOT=/label-studio/data/projects-data

  # S3 Compatible Storage (RustFS)
  rustfs:
    image: rustfs/rustfs:latest
    container_name: rustfs
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      - RUSTFS_ADDRESS=0.0.0.0:9000
      - RUSTFS_CONSOLE_ADDRESS=0.0.0.0:9001
      - RUSTFS_ACCESS_KEY=rustfsadmin
      - RUSTFS_SECRET_KEY=rustfsadmin
      - MINIO_ROOT_USER=rustfsadmin
      - MINIO_ROOT_PASSWORD=rustfsadmin
      - RUSTFS_VOLUMES=/data
    volumes:
      - ../dvc-storage:/data

  # Apache Airflow Standalone
  airflow:
    image: apache/airflow:3.2.0
    container_name: airflow
    ports:
      - "8085:8080"
    user: "501:0"
    env_file:
      - ../.env
    environment:
      - AIRFLOW__CORE__EXECUTOR=SequentialExecutor
      - AIRFLOW__CORE__LOAD_EXAMPLES=False
      - AIRFLOW__CORE__DAGS_FOLDER=/opt/airflow/project/dags
      - AIRFLOW__API__AUTH_BACKENDS=airflow.api.auth.backend.basic_auth
      - _PIP_ADDITIONAL_REQUIREMENTS=pandas numpy requests label-studio-sdk python-dotenv dvc[s3] mlflow
      - _AIRFLOW_WWW_USER_USERNAME=admin
      - _AIRFLOW_WWW_USER_PASSWORD=admin
      - LABEL_STUDIO_URL=http://label-studio:8080
      - LABEL_STUDIO_API_KEY=4c5c6e9a5c5c42458204e855a68a0fcd4c5c6e9a
      - LABEL_STUDIO_PROJECT_ID=1
      - DVC_REMOTE_PCB_VAULT_ENDPOINTURL=http://rustfs:9000
      - DVC_REMOTE_LOGS_STORAGE_ENDPOINTURL=http://rustfs:9000
      - DVC_REMOTE_MODELS_STORAGE_ENDPOINTURL=http://rustfs:9000
      - AWS_ACCESS_KEY_ID=rustfsadmin
      - AWS_SECRET_ACCESS_KEY=rustfsadmin
      - MLFLOW_TRACKING_URI=http://mlflow-official:5000
    volumes:
      - ..:/opt/airflow/project
      - airflow-db:/root/airflow
    working_dir: /opt/airflow/project
    command: bash -c "pip install --no-cache-dir 'torch>=2.0.0' 'torchvision>=0.15.0' pandas 'numpy>=1.24.0' requests label-studio-sdk 'python-dotenv>=1.0.0' 'dvc[s3]>=3.0.0' 'mlflow==2.22.1' 'ultralytics>=8.1.0' 'opencv-python-headless>=4.8.0' onnx onnxruntime onnxslim && airflow db migrate && airflow users create --username admin --password admin --firstname Admin --lastname User --role Admin --email admin@example.com || true && airflow standalone"

volumes:
  airflow-db:

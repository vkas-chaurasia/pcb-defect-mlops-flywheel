name: MLOps Flywheel CI/CD

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

on:
  push:
    branches: [ "main" ]
  pull_request:
    types: [opened, synchronize, reopened]

permissions:
  contents: write
  pull-requests: write

jobs:
  validate-pipeline:
    runs-on: self-hosted
    if: >
      (github.event_name == 'push' || github.event_name == 'pull_request') &&
      !contains(github.event.head_commit.message, 'gov: Promote') &&
      !contains(github.event.head_commit.message, 'Model Governance:')
    permissions:
      contents: write
      pull-requests: write

    steps:
    - name: Determine Branch
      id: get_branch
      run: |
        if [ "${{ github.event_name }}" = "push" ]; then
          echo "branch=main" >> $GITHUB_OUTPUT
        elif [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "branch=${{ github.event.pull_request.head.ref }}" >> $GITHUB_OUTPUT
        else
          echo "branch=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        fi

    - name: Checkout Repository
      uses: actions/checkout@v4
      with:
        fetch-depth: 0
        clean: false
        ref: ${{ steps.get_branch.outputs.branch }}

    - name: Setup Safe CI Environment (macOS)
      run: |
        python3 -m venv .venv_ci_tools
        .venv_ci_tools/bin/pip install setuptools
        echo "$(pwd)/.venv_ci_tools/bin" >> $GITHUB_PATH
        brew install pkg-config cairo pango libffi

    - name: Setup CML
      uses: iterative/setup-cml@v2

    - name: Create Virtual Environment and Install Dependencies
      run: |
        curl -LsSf https://astral.sh/uv/install.sh | sh
        export PATH="$HOME/.cargo/bin:$PATH"
        uv sync
        echo "$GITHUB_WORKSPACE/.venv/bin" >> $GITHUB_PATH

    - name: Infrastructure Health Check
      run: |
        echo "Checking if MLOps Flywheel (Docker) is running on Mac..."
        # Check MLflow (Official) on 5556 and RustFS on 9000
        if curl -sf http://localhost:5556/ > /dev/null && curl -sf http://localhost:9000/health > /dev/null; then
          echo "Infrastructure is HEALTHY! Proceeding with pipeline."
        else
          echo "ERROR: Infrastructure is NOT running!"
          echo "Please ensure 'docker compose -f docker/docker-compose.yml up -d' is running on your Mac."
          exit 1
        fi

    - name: Pull Data from DVC
      env:
        MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
        AWS_ACCESS_KEY_ID: rustfsadmin
        AWS_SECRET_ACCESS_KEY: rustfsadmin
      run: dvc pull -f

    - name: Reproduce Pipeline
      env:
        # CI/CD always logs to the Official Team Instance
        DEFAULT_MLFLOW_URI: "http://localhost:5556"
        MLFLOW_TRACKING_URI: http://localhost:5556
        MLFLOW_S3_ENDPOINT_URL: http://localhost:9000
        AWS_ACCESS_KEY_ID: rustfsadmin
        AWS_SECRET_ACCESS_KEY: rustfsadmin
      run: |
        echo "MLflow Tracking URI: $MLFLOW_TRACKING_URI"
        if [ "${{ github.event_name }}" = "pull_request" ]; then
          echo "Forcing retrain for Pull Request..."
          rm -f dvc.lock .dvc/tmp/lock || true
        fi
        dvc repro
        dvc push

    - name: Update Reference Baseline Predictions
      run: |
        if [ -f last_run_path.txt ]; then
          NEW_RUN_PATH=$(cat last_run_path.txt)
          echo "Updating reference predictions using weights at $NEW_RUN_PATH..."
          python src/monitoring/generate_reference.py --weights "$NEW_RUN_PATH/weights/best.pt"
          
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -f monitoring/reference_predictions.csv dvc.lock models/model_meta.json
          git commit -m "chore: update reference baseline predictions and candidate model state after retraining" || true
          git push origin HEAD:${{ steps.get_branch.outputs.branch }} || true
        else
          echo "No last_run_path.txt found. Skipping reference update."
        fi

    - name: Register Staging Model
      if: github.event_name == 'push'
      env:
        MLFLOW_TRACKING_URI: http://localhost:5556
      run: |
        if [ -f models/model_meta.json ]; then
          python src/utils/register_model.py
        else
          echo "No models/model_meta.json found. Skipping registration."
        fi

    - name: Trigger Airflow Governance DAG
      if: github.event_name == 'push'
      run: |
        echo "Triggering Airflow Governance DAG (model_governance_eval)..."
        # The Airflow container exposes port 8085 on the host Mac
        curl -s -X POST \
          -u "admin:admin" \
          -H "Content-Type: application/json" \
          -d '{}' \
          "http://localhost:8085/api/v1/dags/model_governance_eval/dagRuns"
        echo "\nAirflow DAG Triggered successfully!"

    - name: Generate Metrics Report and Post to GitHub PR
      env:
        REPO_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        # Only generate report if the training stage actually ran (detected by mlflow_run.txt presence/update)
        if [ ! -f mlflow_run.txt ]; then
          echo "Training was skipped by DVC (cached). Skipping report generation."
          exit 0
        fi

        echo "## MLOps Flywheel: Training Report" > report.md
        echo "The automated training run has completed successfully. Below is a detailed performance breakdown." >> report.md
        
        # Performance Diff
        git fetch origin main:main
        echo "### Metrics vs Main" >> report.md
        dvc metrics diff --md --all main >> report.md
        
        # Deep Links to the Original MLflow Run
        source mlflow_run.txt
        echo "---" >> report.md
        echo "* [View Original Training Run]($RUN_URL)" >> report.md
        echo "* [View Full Experiment Suite]($EXP_URL)" >> report.md
        echo "---" >> report.md
        
        # Visual Artifacts
        if [ -f last_run_path.txt ]; then
          ABS_RUN_PATH=$(cat last_run_path.txt)
          # Convert absolute path to relative for CML
          REL_RUN_PATH=$(echo $ABS_RUN_PATH | sed "s|$GITHUB_WORKSPACE/||")
          echo "### Visual Analysis" >> report.md
          
          echo "#### Training Loss and Metrics Curves" >> report.md
          cml publish "$REL_RUN_PATH/results.png" --md >> report.md
          
          echo "#### F1 and Precision-Recall Curves" >> report.md
          cml publish "$REL_RUN_PATH/BoxF1_curve.png" --md >> report.md
          cml publish "$REL_RUN_PATH/BoxPR_curve.png" --md >> report.md
          
          echo "#### Confusion Matrix (Normalized)" >> report.md
          cml publish "$REL_RUN_PATH/confusion_matrix_normalized.png" --md >> report.md
        fi
        
        # Update existing comment or create new one with watermark
        cml comment create --watermark-title="mlops-report" report.md
        
        # Clean up temporary handover files so they don't trigger report on next minor commit
        rm -f mlflow_run.txt last_run_path.txt
